<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f1e9"><meta name="description" content="A quiet note from Kim & Jim."><meta property="og:title" content="A quiet note from Kim & Jim"><meta property="og:description" content="Open when you have a minute."><title>A quiet note from Kim & Jim</title>
<style>
:root{--bg:#f5f1e9;--ink:#23312f;--muted:#68716d;--line:#c9c5bc;--sage:#9eafa1;--warm:#c89d78}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Georgia,'Times New Roman',serif;color:var(--ink)}button{font:inherit;cursor:pointer}.quiet{min-height:100svh;overflow:hidden;background:var(--bg);position:relative}.grain{position:absolute;inset:0;opacity:.25;pointer-events:none;background-image:radial-gradient(#7d887f 0.45px,transparent .45px);background-size:7px 7px}.page{min-height:100svh;padding:clamp(30px,7vw,80px) clamp(24px,8vw,120px);display:flex;flex-direction:column;justify-content:space-between;position:relative}.masthead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px;font:11px/1.3 ui-monospace,monospace;letter-spacing:.16em;color:var(--muted)}.mark{width:26px;height:26px;border:1px solid var(--sage);border-radius:50%;display:grid;place-items:center;color:var(--sage);font:13px Georgia}.intro{max-width:720px;margin:auto;padding:50px 0}.kicker{font:11px ui-monospace,monospace;letter-spacing:.18em;color:var(--warm);text-transform:uppercase;margin:0 0 22px}.intro h1{font-size:clamp(46px,9vw,105px);line-height:.92;letter-spacing:-.06em;font-weight:400;margin:0 0 26px;max-width:750px}.intro p{font-size:clamp(18px,2.6vw,27px);line-height:1.4;color:var(--muted);max-width:490px;margin:0}.quiet-button{margin-top:34px;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:14px 22px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;transition:.2s}.quiet-button:hover{background:var(--ink);color:var(--bg)}.bottom{font:11px ui-monospace,monospace;letter-spacing:.14em;color:var(--muted)}.story{opacity:0;transition:opacity 1.3s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:100svh;padding:34px}.story.on{opacity:1}.chapter{font:11px ui-monospace,monospace;letter-spacing:.18em;color:var(--warm);text-transform:uppercase;margin:0 0 26px}.story h2{font-size:clamp(40px,8vw,96px);line-height:.98;letter-spacing:-.06em;font-weight:400;max-width:860px;margin:0}.story p{color:var(--muted);font-size:clamp(17px,2.5vw,24px);margin:26px auto 0;max-width:500px;line-height:1.45}.story .date{color:var(--ink);font-size:clamp(24px,4vw,42px);letter-spacing:.02em}.final{background:#e8eee8}.final h2{color:#273a33}.final .signature{font-size:18px;color:var(--ink);margin-top:38px}.progress{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:6px}.dot{width:5px;height:5px;border-radius:50%;background:var(--line);transition:.4s}.dot.active{background:var(--sage);transform:scale(1.35)}.skip{position:absolute;right:clamp(24px,8vw,120px);bottom:24px;border:0;background:none;color:var(--muted);font:10px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}@media(max-width:520px){.masthead{font-size:9px}.intro{padding:30px 0}.intro h1{font-size:52px}.intro p{font-size:19px}.story h2{font-size:48px}.story p{font-size:18px}.skip{display:none}}
</style></head><body><main class="quiet" id="app"><div class="grain"></div></main>
<script>
const app=document.getElementById('app');let started=false,timer=0,step=0;const slides=[['A note, just for you','We wanted to tell you ourselves.'],['A little more life','Things are about to look a little different around here.'],['One more at the table','There will soon be a new place to set.'],['A new chapter','We are making room for someone very small.'],['The timing','We are expecting our little one in','February 2027'],['The news','Kim & Jim are having a baby boy.','We cannot wait to meet him.']];
function welcome(){app.innerHTML='<div class="grain"></div><section class="page"><header class="masthead"><span>KIM + JIM</span><span class="mark">&amp;</span><span> A QUIET NOTE</span></header><div class="intro"><p class="kicker">For a friend</p><h1>Open when you have a minute.</h1><p>A small note from us, shared a little more slowly than usual.</p><button class="quiet-button" id="open">Read the note</button></div><p class="bottom">NO RUSH &nbsp;·&nbsp; TAKE YOUR TIME</p></section>';document.getElementById('open').onclick=()=>{started=true;step=0;show()}}
function show(){let s=slides[step];app.innerHTML='<div class="grain"></div><section class="story '+(step===slides.length-1?'final':'')+' on"><p class="chapter">'+String(step+1).padStart(2,'0')+' / 06</p><h2>'+s[0]+'</h2><p>'+s[1]+'</p>'+(s[2]?'<p class="date">'+s[2]+'</p>':'')+(step===slides.length-1?'<p class="signature">With love,<br>Kim &amp; Jim</p>':'')+'</section><div class="progress">'+slides.map((_,i)=>'<i class="dot '+(i<=step?'active':'')+'"></i>').join('')+'</div>'+(step<slides.length-1?'<button class="skip" id="next">Continue</button>':'<button class="skip" id="again">Read again</button>');if(step<slides.length-1){document.getElementById('next').onclick=()=>{clearTimeout(timer);step++;show()};timer=setTimeout(()=>{step++;show()},step===0?4200:3600)}else document.getElementById('again').onclick=welcome}
welcome();
</script></body></html>
