<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071521"><meta name="description" content="A special delivery from Kim & Jim."><meta property="og:title" content="StorkMail // A special delivery"><meta property="og:description" content="A special delivery from Kim & Jim."><meta property="og:image" content="og.png"><title>StorkMail // A special delivery</title>
<style>
:root{--paper:#f4ead8;--card:#fff8ec;--ink:#0d1b2a;--muted:#4a5864;--rule:#8e8373;--seal:#b7413e;--decode:#071521;--cyan:#5db6e8;--blue:#0e5e8d;--highlight:#64d3ff;--white:#f8fbff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--decode)}body{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}.app{min-height:100svh;width:100%;overflow:hidden;touch-action:manipulation;user-select:none}.scene{min-height:100svh;width:100%;padding:clamp(24px,5vw,54px);position:relative;overflow:hidden}.micro{font-size:clamp(10px,1.5vw,14px);letter-spacing:.16em;line-height:1.4}.white{color:var(--white)}.splash{background:var(--paper);display:flex;flex-direction:column;justify-content:space-between}.stamp{font-size:clamp(16px,3vw,24px);letter-spacing:.24em;font-weight:700;border-bottom:1px solid var(--rule);padding-bottom:18px}.stamp span{float:right;color:var(--muted);font-size:.55em;letter-spacing:.16em;padding-top:5px}.center{width:min(100%,520px);margin:auto;padding:54px 0}.eyebrow{color:var(--seal);font-size:12px;letter-spacing:.17em;font-weight:700;margin:0 0 20px}.splash h1{font-family:Arial,sans-serif;font-size:clamp(42px,8vw,76px);line-height:.96;letter-spacing:-.06em;margin:0 0 22px}.copy{color:var(--muted);font-size:clamp(14px,2vw,18px);line-height:1.5;margin:0 0 34px;max-width:410px}form{display:grid;gap:12px;max-width:390px}label{font-size:12px;letter-spacing:.14em;font-weight:700}input{border:1px solid var(--rule);border-radius:6px;background:var(--card);padding:16px 17px;color:var(--ink);outline:0;user-select:text}input:focus{border-color:var(--seal);box-shadow:0 0 0 3px #b7413e22}.primary,.open{border:0;background:var(--seal);color:var(--white);border-radius:6px;font-weight:700;letter-spacing:.08em;padding:16px 18px}.primary span{float:right}.err{color:var(--seal);font-size:12px;margin:2px 0 0}.foot{color:var(--muted);font-size:11px;letter-spacing:.16em}.header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.brand{font-size:clamp(22px,4vw,34px);font-weight:700;letter-spacing:.24em}.inbox{background:var(--paper)}.inbox .micro{color:var(--muted);margin-top:8px}.badge{background:var(--seal);color:var(--white);border-radius:6px;padding:14px 16px;font-size:clamp(12px,2vw,17px);font-weight:700;letter-spacing:.1em;white-space:nowrap}.rule{height:1px;background:var(--rule);width:100%}.inbox>.rule{margin:28px 0 22px}.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:clamp(24px,5vw,40px);min-height:min(58svh,360px);display:flex;flex-direction:column}.meta{display:grid;grid-template-columns:64px 1fr;gap:24px;align-items:center;margin-bottom:18px}.meta span{color:var(--muted);font-size:12px;letter-spacing:.13em}.meta strong{font-size:clamp(19px,4vw,30px);letter-spacing:.04em}.card h1{font-family:Arial,sans-serif;font-size:clamp(32px,7vw,66px);letter-spacing:-.05em;line-height:.92;margin:26px 0}.bottom{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}.open{padding:17px 20px;white-space:nowrap;font-size:12px}.inbox-foot{position:absolute;bottom:clamp(24px,5vw,54px);left:clamp(24px,5vw,54px)}.decode{background:var(--decode);color:var(--white)}.decode-brand{color:var(--cyan);font-size:clamp(14px,2.5vw,22px);letter-spacing:.15em}.track{height:2px;background:#24485f;margin-top:24px}.fill{height:100%;background:var(--cyan)}.status{color:var(--cyan);text-align:center;font-size:12px;letter-spacing:.16em;margin:22px 0}.clue{opacity:0;text-align:center;margin-top:clamp(55px,10vw,100px);transition:opacity .3s}.clue.show{opacity:1}.clue span,.clue strong{display:block}.clue span{color:var(--cyan);font-size:12px;letter-spacing:.2em}.clue strong{font-family:Arial,sans-serif;font-size:clamp(28px,6vw,54px);margin-top:16px}.payload{opacity:0;display:grid;gap:26px;text-align:center;margin-top:clamp(42px,8vw,78px);transition:opacity .3s}.payload.show{opacity:1}.payload strong{color:var(--cyan);font-size:clamp(25px,5vw,44px);letter-spacing:.16em}.payload span{font-family:Arial,sans-serif;color:var(--white);font-size:clamp(42px,9vw,78px);letter-spacing:.18em}.decode-foot{position:absolute;bottom:clamp(24px,5vw,54px);left:24px;right:24px;color:var(--cyan);text-align:center}.wipe{position:absolute;inset:0 auto 0 0;background:var(--blue);z-index:3}.final{background:var(--blue);color:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.border{position:absolute;inset:0;border:clamp(5px,1vw,10px) solid var(--highlight);animation:pulse 1.4s ease-in-out infinite alternate}.top{position:absolute;top:clamp(28px,6vw,58px)}.finalcopy{text-align:center}.personal{color:var(--highlight);font-size:clamp(11px,1.8vw,15px);letter-spacing:.17em;margin:0 0 22px}.final h1{font-family:Arial,sans-serif;font-size:clamp(52px,12vw,110px);line-height:.88;letter-spacing:-.08em;margin:0}.support{font-size:clamp(14px,2.5vw,24px);letter-spacing:.09em;margin:38px 0 0}.support span{color:var(--highlight);padding:0 8px}.finalfoot{position:absolute;bottom:clamp(42px,8vw,80px);color:var(--highlight)}.hint{position:absolute;bottom:clamp(20px,4vw,34px);opacity:.65;font-size:9px}@keyframes pulse{from{border-width:5px}to{border-width:10px}}@media(max-width:480px){.scene{padding:24px 20px}.center{padding:30px 0}.header{align-items:flex-start;flex-direction:column}.header .badge{align-self:flex-end}.meta{grid-template-columns:48px 1fr;gap:14px}.meta strong{font-size:20px}.card h1{font-size:38px}.bottom{align-items:stretch;flex-direction:column}.open{width:100%}.inbox-foot{left:20px;bottom:24px}.decode .header{flex-direction:row}.clue{margin-top:64px}.payload{margin-top:52px}.support{line-height:1.5;max-width:300px}}
</style></head><body><main id="app" class="app"></main>
<script>
const root=document.getElementById('app');let name='',scene='splash',start=0,raf=0,hold=0,elapsed=0;
const clean=v=>v.trim().replace(/\s+/g,' ').slice(0,32);
function splash(){root.innerHTML=`<section class="scene splash"><div class="stamp">STORKMAIL <span>SM—027</span></div><div class="center"><p class="eyebrow">A PRIORITY DELIVERY IS WAITING</p><h1>Type your first name</h1><p class="copy">The stork has a message for you from Kim &amp; Jim.</p><form><label for="n">FIRST NAME</label><input id="n" autocomplete="given-name" autocapitalize="words" maxlength="32" placeholder="Your first name"><button class="primary">RECEIVE DELIVERY <span>↗</span></button><p class="err"></p></form></div><p class="foot">HANDLE WITH CARE <span>•</span> FEBRUARY 2027</p></section>`;root.querySelector('form').onsubmit=e=>{e.preventDefault();let v=clean(root.querySelector('#n').value);if(!v){root.querySelector('.err').textContent='Please enter your first name to receive the delivery.';return}name=v;scene='inbox';inbox()}}
function inbox(){root.innerHTML=`<section class="scene inbox"><div class="header"><div><div class="brand">STORKMAIL</div><div class="micro">PRIORITY DELIVERY // SM—027</div></div><div class="badge">1 NEW</div></div><div class="rule"></div><article class="card"><div class="meta"><span>TO</span><strong>${name.toUpperCase()}</strong></div><div class="meta"><span>FROM</span><strong>THE STORK</strong></div><div class="rule"></div><h1>YOU HAVE A<br>NEW MESSAGE</h1><div class="bottom"><span class="micro">MESSAGE STATUS // UNOPENED</span><button class="open">OPEN MESSAGE</button></div></article><p class="micro inbox-foot">AIR DELIVERY // HANDLE WITH CARE</p></section>`;root.querySelector('.open').onclick=()=>{scene='decode';start=performance.now();tick()}}
function tick(){elapsed=performance.now()-start;if(elapsed>=10000&&scene==='decode'){scene='final';final()}if(scene==='decode')drawDecode();if(elapsed<12000)raf=requestAnimationFrame(tick);else{elapsed=12000;scene='final';final()}}
function drawDecode(){let e=elapsed,code=e<5000?'42':e<5500?'42  ·  4F':'42  ·  4F  ·  59',dec=e<6800?'B   _   _':e<7600?'B   O   _':'B   O   Y';root.innerHTML=`<section class="scene decode"><div class="header"><div class="decode-brand">STORKMAIL // SECURE CHANNEL</div><div class="micro white">LINK VERIFIED</div></div><div class="track"><div class="fill" style="width:${Math.min(100,Math.max(0,(e-1000)/20))}%"></div></div><p class="status">SECURE CHANNEL // ${e<1000?'ESTABLISHING':e<3000?'AUTHENTICATING':e<4500?'VERIFIED':e<6000?'RECEIVING':'DECRYPTING'}</p><div class="clue ${e>=3000?'show':''}"><span>ETA</span><strong>FEBRUARY 2027</strong></div><div class="payload ${e>=4500?'show':''}"><strong>${code}</strong><span>${dec}</span></div><p class="decode-foot micro">42 / 4F / 59 // HEX DELIVERY MANIFEST</p>${e>=8500?`<div class="wipe" style="width:${Math.min(100,(e-8500)/15)}%"></div>`:''}</section>`}
function final(){root.innerHTML=`<section class="scene final"><div class="border"></div><div class="top micro">STORKMAIL // DELIVERY CONFIRMED</div><div class="finalcopy"><p class="personal">SPECIAL DELIVERY FOR ${name.toUpperCase()}</p><h1>IT’S A BOY</h1><p class="support">BABY HERBERT <span>•</span> ARRIVING FEBRUARY 2027</p></div><p class="finalfoot micro">PRIORITY DELIVERY // KIM + JIM</p><p class="hint micro">PRESS AND HOLD TO REPLAY</p></section>`;let f=root.querySelector('.final');f.onpointerdown=()=>{if(elapsed<12000)return;hold=setTimeout(()=>{scene='inbox';inbox()},2000)};['pointerup','pointercancel','pointerleave'].forEach(x=>f.addEventListener(x,()=>clearTimeout(hold)))}
splash();
</script></body></html>
